
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tokyo 東京旅行 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-serif: 'Noto Serif TC', serif;
            --font-sans: 'Inter', 'Noto Sans TC', sans-serif;
            --color-ivory: #FFFDF5; 
            --color-gold-brown: #C5A373; 
            --color-dark: #2A2621;
        }
        body {
            font-family: var(--font-sans);
            background-color: var(--color-ivory);
            color: var(--color-dark);
            -webkit-font-smoothing: antialiased;
        }
        .font-serif {
            font-family: var(--font-serif);
            letter-spacing: 0.08em;
        }
        h1, h2, h3, h4 {
            font-family: var(--font-serif);
            color: var(--color-dark);
        }
        /* 高級感漸次浮現動畫 */
        .luxury-fade-in {
            animation: luxuryFade 1.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes luxuryFade {
            0% { opacity: 0; transform: translateY(15px); filter: blur(8px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }
        .luxury-card {
            background: white;
            border: 1px solid rgba(197, 163, 115, 0.15);
            box-shadow: 0 10px 40px -15px rgba(197, 163, 115, 0.1);
            transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .luxury-card:active {
            transform: scale(0.98);
            filter: brightness(0.98);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .text-gold {
            color: var(--color-gold-brown);
        }
        .bg-gold {
            background-color: var(--color-gold-brown);
        }
        .border-gold {
            border-color: rgba(197, 163, 115, 0.3);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
